[project]
name = "bactgen-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0"]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10", "snakemake==8.30.0"]
[tool.pytest.ini_options]
pythonpath = ["workflow/scripts"]
markers = ["integration: requires real tools, reads, and databases"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
